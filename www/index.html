<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الدواء - Dawa Helper</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f5;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #1b3b2b;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }
        .btn {
            background-color: #2e694e;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مساعد الدواء</h1>
        <h2>Dawa Helper</h2>
        <p>-- : --</p>
        <button class="btn">+ إضافة دواء</button>
        <button class="btn" style="background-color: #fff; color: #333; border: 1px solid #ccc;">أويتي المحفوظة (مراجعة / حذف)</button>
        <h3>السجل</h3>
    </div>

</body>
</html>
